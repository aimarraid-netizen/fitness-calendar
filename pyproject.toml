[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["analyze", "cardio_common", "db", "exercise_config", "hr_config", "kratt_tools", "parse_fit", "parse_gpx", "parse_gymaholic_csv", "queries", "render_html", "validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
